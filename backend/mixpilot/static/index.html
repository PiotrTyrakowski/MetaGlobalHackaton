<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MixPilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f2ee; --panel:#fbfaf8; --card:#ffffff; --line:#e3dfd8; --line-strong:#cfc9bf;
  --ink:#1f1d1a; --ink-2:#5c5750; --ink-3:#8c867d;
  --accent:#0f766e; --accent-soft:#0f766e1a; --warn:#c2410c; --warn-soft:#c2410c14; --bad:#b91c1c;
  --grid:#ebe7e0; --on-accent:#fff;
  --mono:'IBM Plex Mono',ui-monospace,monospace; --sans:'IBM Plex Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141312; --panel:#1b1a18; --card:#22201e; --line:#33302c; --line-strong:#45413b;
  --ink:#eeebe6; --ink-2:#b3ada4; --ink-3:#857f76;
  --accent:#2dd4bf; --accent-soft:#2dd4bf1f; --warn:#fb923c; --warn-soft:#fb923c1a; --bad:#f87171;
  --grid:#2a2825; --on-accent:#0b1312;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.55}
.mono{font-family:var(--mono)}

.top{display:flex;align-items:center;gap:16px;padding:0 18px;height:50px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{display:flex;align-items:center;gap:8px;font-weight:600}
.logo i{width:20px;height:20px;border-radius:6px;background:var(--accent)}
.nav{display:flex;gap:4px;margin-left:auto;height:100%}
.nav button{border:0;background:none;padding:0 14px;color:var(--ink-3);border-bottom:2px solid transparent}
.nav button.on{color:var(--ink);border-bottom-color:var(--accent)}

.view{flex:1;min-height:0;display:none}
.view.on{display:grid}
#project{grid-template-columns:minmax(360px,40%) 1fr}
.chat{display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0;background:var(--panel)}
.stream{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px}
.user{align-self:flex-end;background:var(--card);border:1px solid var(--line);border-radius:12px 12px 4px 12px;padding:10px 12px;max-width:85%}
.agent{display:flex;flex-direction:column;gap:8px}
.agent p{margin:0}
.agent .items,.agent .texts{display:flex;flex-direction:column;gap:8px}
.agent .items:empty,.agent .texts:empty{display:none}
.files{display:flex;flex-wrap:wrap;gap:6px}
.user .files{margin-top:0}
.user .txt + .files{margin-top:8px}
.file{font-size:12px;padding:3px 8px;border:1px solid var(--line);border-radius:6px;color:var(--ink-2)}
.art{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--card);text-align:left;width:100%}
.art:hover,.art.on{border-color:var(--accent)}
.art .t{font-weight:500}
.art .s{font-size:12px;color:var(--ink-3)}
.art .go{margin-left:auto;color:var(--ink-3);font-size:12px}
.find{border-radius:10px;padding:10px 12px;border:1px solid}
.find.new{border-color:var(--accent);background:var(--accent-soft)}
.find.miss{border-color:var(--warn);background:var(--warn-soft)}
.find .h{font-weight:600;font-size:13px}
.find.new .h{color:var(--accent)} .find.miss .h{color:var(--warn)}
.find .d{font-size:13px;color:var(--ink-2)}
.find .use{margin-top:8px}
.btn.sm{padding:5px 12px;font-size:13px}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:8px 16px;font-weight:500;align-self:flex-start}
.btn.ghost{background:none;border:1px solid var(--line-strong);color:var(--ink)}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3)}
.status::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--line-strong);border-top-color:var(--accent);animation:spin .8s linear infinite}
.status[hidden]{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.err{font-size:13px;color:var(--bad)}
.composer{margin:0 16px 16px;border:1px solid var(--line-strong);border-radius:12px;background:var(--card);padding:8px 8px 8px 12px;display:flex;gap:8px;align-items:center}
.composer input[type=text]{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:14px var(--sans);min-width:0}
.clip{border:0;background:none;color:var(--ink-3);padding:4px 6px;font-size:13px}
.empty{margin:auto;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;gap:12px;align-items:center;max-width:320px}
.empty .btn{align-self:center}

.pane{display:flex;flex-direction:column;min-height:0}
.ptabs{display:flex;gap:2px;padding:8px 14px 0;border-bottom:1px solid var(--line);min-height:41px}
.ptab{border:1px solid transparent;border-bottom:0;background:none;padding:7px 14px;border-radius:8px 8px 0 0;color:var(--ink-3)}
.ptab.on{background:var(--panel);border-color:var(--line);color:var(--ink);margin-bottom:-1px}
.pbody{flex:1;overflow:auto;padding:24px 28px 40px;background:var(--panel)}
.pbody h2{margin:0 0 4px;font-size:18px;font-weight:600}
.pbody h3{margin:28px 0 2px;font-size:15px;font-weight:600}
.pbody h3 + .note{margin:0 0 12px}
.lead{color:var(--ink-2);margin:0 0 20px;max-width:680px}
.note{font-size:12.5px;color:var(--ink-3);max-width:680px}
.blank{color:var(--ink-3);margin-top:40px;text-align:center}
.card{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:14px 18px;margin-bottom:14px}
.big{display:flex;gap:28px;margin-bottom:18px}
.big .n{font-size:28px;font-weight:600;letter-spacing:-.5px}
.big .l{font-size:12px;color:var(--ink-3)}
table{width:100%;border-collapse:collapse}
th{font-weight:500;color:var(--ink-3);text-align:left;font-size:12px;padding:8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--mono);font-size:13px;white-space:nowrap}
tr.hl-new td{background:var(--accent-soft)}
tr.hl-miss td{background:var(--warn-soft)}
tr.win td{background:var(--accent-soft);font-weight:500}
.bar{height:8px;border-radius:9px;background:var(--grid);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);transition:width .3s}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:5px;font-weight:500}
.tag.new{color:var(--accent);background:var(--accent-soft)}
.tag.miss{color:var(--warn);background:var(--warn-soft)}
.tag.base{color:var(--ink-2);border:1px solid var(--line)}
svg text{font-family:var(--sans)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink-2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:9px;margin-right:5px;vertical-align:-1px}
.scroll-x{overflow-x:auto}

#models{padding:28px;overflow:auto}
#models.on{display:block}
#models .wrap{max-width:900px;margin:0 auto}
@media (max-width:900px){#project.on{display:block;overflow:auto}.chat{border-right:0;border-bottom:1px solid var(--line);min-height:70vh}.stream{overflow:visible}.pbody{padding:20px 16px}#models{padding:20px 16px}}
</style>
</head>
<body>

<header class="top">
  <div class="logo"><i></i>MixPilot</div>
  <nav class="nav"><button class="on" data-v="project">Project</button><button data-v="models">Models</button></nav>
</header>

<main class="view on" id="project">
  <section class="chat">
    <div class="stream" id="stream"></div>
    <form class="composer" id="composer">
      <button type="button" class="clip" id="attach" title="Add Excel files">+ Files</button>
      <input type="text" id="msg" placeholder="Ask about your mixes…" autocomplete="off">
      <button class="btn" id="send">Send</button>
    </form>
    <input type="file" id="picker" accept=".xlsx,.xls,.csv" multiple hidden>
  </section>
  <section class="pane">
    <nav class="ptabs" id="tabs"></nav>
    <div class="pbody" id="pbody"><p class="blank">Data, training and results appear here.</p></div>
  </section>
</main>

<main class="view" id="models"><div class="wrap">
  <h2 style="margin:0 0 4px;font-size:20px">Models</h2>
  <p class="lead">Models trained on your data. Use one in chat to predict a mix.</p>
  <div id="modelList"></div>
</div></main>


<script>
const $ = id => document.getElementById(id);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
const fmt = n => Math.round(n).toLocaleString('en-US');
const pct = x => Math.round(x * 100) + '%';

const NAMES = {
  'Cement (kg/m3)': 'Cement', 'Fly Ash (kg/m3)': 'Fly ash', 'Slag (kg/m3)': 'Slag', 'Water (kg/m3)': 'Water',
  'HRWR (kg/m3)': 'Superplasticizer (HRWR)', 'Fine Aggregate (kg/m3)': 'Fine aggregate',
  'Coarse Aggregates (kg/m3)': 'Coarse aggregate', 'Temp (C)': 'Curing temperature',
};
const FRIENDLY = { 'air': 'Air content', 'site water': 'Water added on site' };
const label = name => NAMES[name] || FRIENDLY[name.replace(/ \(.*\)$/, '').toLowerCase()] || name.replace(/ \(.*\)$/, '');

// ------------------------------------------------------------------ state
let sid = null, es = null, lastSeq = -1, block = null, busy = false;
const art = {};               // artifact name -> latest data
const chips = {};             // artifact name -> chip element in chat
let cur = null;

// ------------------------------------------------------------------ chat rendering
const stream = $('stream');
function scroll() { stream.scrollTop = stream.scrollHeight; }

function agentBlock(fresh) {
  if (!block || fresh) {
    block = document.createElement('div');
    block.className = 'agent';
    block.innerHTML = '<div class="texts"></div><div class="items"></div><div class="actions"></div><div class="status" hidden></div>';
    stream.append(block);
  }
  return block;
}
function setStatus(text) {
  const st = agentBlock().querySelector('.status');
  st.hidden = !text; st.textContent = text || '';
  scroll();
}
function addItem(el) { agentBlock().querySelector('.items').append(el); scroll(); }

function chip(name, title, sub) {
  if (!chips[name] || !chips[name].isConnected) {
    const b = document.createElement('button');
    b.className = 'art'; b.dataset.a = name;
    addItem(b); chips[name] = b;
  }
  chips[name].innerHTML = `<span><div class="t">${title}</div><div class="s">${sub}</div></span><span class="go">Open ›</span>`;
  chips[name].classList.toggle('on', cur === name);
}

const handlers = {
  message(e) {
    const d = document.createElement('div'); d.className = 'user';
    d.innerHTML = (e.text ? `<div class="txt">${md(e.text)}</div>` : '') +
      (e.files ? `<div class="files">${e.files.map(f => `<span class="file">${esc(f)}</span>`).join('')}</div>` : '');
    stream.querySelector('.empty')?.remove();
    stream.append(d); block = null; scroll();
  },
  busy(e) { setBusy(true); if (e.kind === 'training') agentBlock(true); setStatus(e.kind === 'training' ? 'Training…' : 'Thinking…'); },
  idle() { setBusy(false); setStatus(''); },
  tool(e) { if (e.status === 'running') setStatus(e.label + '…'); },
  tool_progress(e) { setStatus(e.text + '…'); },
  message_start(e) {
    const p = document.createElement('p'); p.id = 'm' + e.seq;
    agentBlock().querySelector('.texts').append(p);
  },
  text_delta(e) { const p = $('m' + e.message); if (p) { p.dataset.raw = (p.dataset.raw || '') + e.text; p.innerHTML = md(p.dataset.raw); scroll(); } },
  message_end(e) { const p = $('m' + e.message); if (p && e.interim) p.remove(); else if (p) p.innerHTML = md(e.text); },
  card(e) {
    const d = document.createElement('div');
    const name = label(e.input);
    if (e.kind === 'input_ready') {
      d.className = 'find new';
      const where = e.mixes_with_value === e.mixes ? `all ${e.mixes} mixes` : `${e.mixes_with_value} of ${e.mixes} mixes`;
      d.innerHTML = `<div class="h">${esc(name)}: ready to use</div><div class="d">In ${esc(e.file)} for ${where}. Added as a new model input.</div>`;
    } else {
      d.className = 'find miss'; d.dataset.card = e.input;
      d.innerHTML = `<div class="h">${esc(name)}: only ${e.mixes_with_value} of ${e.mixes} mixes</div><div class="d">On those mixes it makes the model's 28-day strength predictions ${pct(e.gain)} more accurate.</div><div class="use"><button class="btn sm" data-input="${esc(e.input)}">Use it in training</button></div>`;
    }
    addItem(d);
  },
  train_button() {
    $('train')?.remove();
    const actions = agentBlock().querySelector('.actions');
    actions.innerHTML = '<button class="btn" id="train">Train model</button>';
    scroll();
  },
  artifact(e) {
    art[e.name] = e.data;
    const d = e.data;
    if (e.name === 'data') chip('data', 'Data', `${d.mixes} mixes · model inputs and coverage`);
    if (e.name === 'training') {
      chip('training', 'Training', d.status === 'done' ? `${d.total} setups · best −${pct(d.gain)}` : `${d.done} of ${d.total} setups`);
      if (d.status === 'running') setStatus(`Training: ${d.done} of ${d.total} setups`);
      if (!cur || cur === 'data') show('training');
    }
    if (e.name === 'results') { chip('results', 'Results', 'less CO₂ at the same strength'); show('results'); }
    if (e.name === 'data' && !cur) show('data');
    if (cur === e.name) show(cur);
  },
  input_used(e) {
    document.querySelectorAll('.find[data-card]').forEach(c => {
      if (c.dataset.card === e.input) c.querySelector('.use').innerHTML = '<span class="tag new">used in training</span>';
    });
  },
  models_updated() { $('train')?.remove(); loadModels(); },
  error(e) { const d = document.createElement('div'); d.className = 'err'; d.textContent = e.text; addItem(d); },
};

function setBusy(b) {
  busy = b;
  $('send').disabled = b; $('attach').disabled = b;
  $('msg').placeholder = b ? 'Working…' : 'Ask about your mixes…';
}

// ------------------------------------------------------------------ panels
const A = {
  data: { t: 'Data', render: d => {
    const n = d.mixes;
    const dropped = Object.entries(d.dropped).map(([k, v]) => `${v} cylinder${v > 1 ? 's' : ''} (${esc(k)})`).join(', ');
    const o = d.output;
    return `<h2>Your data</h2>
    <p class="lead">The model learns to predict your concrete's strength at each test age from the mix inputs below.</p>
    <div class="big"><div><div class="n">${n}</div><div class="l">mixes</div></div><div><div class="n">${fmt(d.cylinders_used)}</div><div class="l">cylinders used, of ${fmt(d.cylinders_read)}</div></div><div><div class="n">${d.ages.join(' · ')}</div><div class="l">test ages (days)</div></div></div>
    ${o ? `<h3>Output: concrete strength</h3>
    <p class="note">From ${esc(o.source.file)} · ${esc(o.source.column)} at ${esc(o.age.column)}. One line per mix, the average of its cylinders. psi (pounds per square inch) is the US unit of concrete strength.</p>
    <div class="card">${strengthChart(o.curves, d.ages)}<div class="legend"><span><i style="background:${css('--ink-3')};opacity:.5"></i>each mix</span><span><i style="background:${css('--accent')}"></i>median of your mixes</span></div></div>` : ''}
    <h3>Inputs</h3>
    <p class="note">Where each input came from and how many of your ${n} mixes have it.</p>
    <div class="card scroll-x" style="padding:4px 10px"><table>
      <tr><th>Input</th><th>From</th><th style="width:26%">Coverage</th><th class="num"></th></tr>
      ${d.coverage.map(r => {
        const k = r.status === 'new' ? 'new' : r.status === 'incomplete' ? 'miss' : '';
        const tag = k === 'new' ? ' <span class="tag new">new · added</span>' : k === 'miss' ? ' <span class="tag miss">partly logged</span>' : '';
        const src = r.source ? `${esc(r.source.file)} · ${esc(r.source.column)}` : '';
        return `<tr class="${k ? 'hl-' + k : ''}"><td>${esc(label(r.input))}${tag}</td><td style="color:var(--ink-3);font-size:12.5px">${src}</td><td><div class="bar"><span style="width:${r.mixes_with_value / r.mixes * 100}%;${k === 'miss' ? 'background:var(--warn)' : ''}"></span></div></td><td class="num">${r.mixes_with_value}/${r.mixes}</td></tr>`;
      }).join('')}
    </table></div>
    <p class="note">${dropped ? `Left out: ${dropped}. ` : ''}${convs(d.conversions)}</p>`;
  }},

  training: { t: 'Training', render: d => {
    if (d.status !== 'done') {
      return `<h2>Training on your data</h2>
      <p class="lead">Trying ${d.total} setups${d.extra_inputs.length ? ', adding ' + d.extra_inputs.map(e => esc(label(e).toLowerCase())).join(', then ') + ' one at a time' : ''}. Each is tested on mixes it never saw.</p>
      <div class="card"><div class="bar" style="height:10px"><span style="width:${d.done / d.total * 100}%"></span></div>
      <p class="note" style="margin:10px 0 0">${d.done} of ${d.total} setups${d.best_so_far ? ` · best so far ±${fmt(d.best_so_far.rmse_28d)} psi` : ''}</p></div>`;
    }
    const max = Math.max(...d.rows.map(r => r.rmse_28d));
    const chosen = d.rows.find(r => r.chosen);
    const changes = [];
    if (chosen && chosen.settings.gate_tau !== 0.1) changes.push(`time-gate τ 0.10 → ${chosen.settings.gate_tau.toFixed(2)}`);
    if (chosen && chosen.settings.mll_weight !== 0.5) changes.push(`loss mix 0.5 → ${chosen.settings.mll_weight}`);
    return `<h2>Training on your data</h2>
    <p class="lead">Each setup learns from part of your mixes and is tested on the rest, so every one of your ${d.model.mixes} mixes is predicted by a model that never saw it (5-fold cross-validation). The error is how far those 28-day strength predictions are from your real cylinder breaks, on average. Each row adds one thing to the row above.</p>
    <div class="big"><div><div class="n">±${fmt(d.best_rmse_28d)} <span style="font-size:14px;font-weight:400">psi</span></div><div class="l">average 28-day prediction error${d.typical_28d_psi ? `, ${pct(d.best_rmse_28d / d.typical_28d_psi)} of a typical ${fmt(d.typical_28d_psi)} psi mix` : ''}</div></div><div><div class="n" style="color:var(--accent)">−${pct(d.gain)}</div><div class="l">vs Meta's default setup</div></div></div>
    <div class="card scroll-x" style="padding:4px 10px"><table>
      <tr><th>Setup</th><th class="num">28-day prediction error</th><th style="width:40%"></th></tr>
      ${d.rows.map((r, i) => `<tr class="${r.chosen ? 'win' : ''}"><td>${esc(r.row.startsWith('+ ') && r.extra_inputs.length ? '+ ' + label(r.extra_inputs.at(-1)).toLowerCase() : r.row)}${i === 0 ? ' <span class="tag base">baseline</span>' : ''}${r.chosen ? ' <span class="tag new">best</span>' : ''}</td><td class="num">${fmt(r.rmse_28d)} psi</td><td><div class="bar"><span style="width:${r.rmse_28d / max * 100}%;${r.chosen ? '' : 'opacity:.4'}"></span></div></td></tr>`).join('')}
    </table></div>
    <p class="note">Saved as model ${esc(d.model.version)}.${changes.length ? ' Tuned settings: ' + changes.join(', ') + '.' : ''} psi is pounds per square inch, the US unit of concrete strength (1,000 psi ≈ 6.9 MPa).</p>`;
  }},

  results: { t: 'Results', render: d => {
    const ex = d.existing, pr = d.proposals;
    const xs = [...ex.map(p => p.gwp), ...pr.map(p => p.gwp)], ys = [...ex.map(p => p.psi), ...pr.map(p => p.pred_psi)];
    const x0 = Math.floor(Math.min(...xs) / 50) * 50 - 10, x1 = Math.ceil(Math.max(...xs) / 50) * 50 + 10;
    const y0 = Math.floor(Math.min(...ys) / 1000) * 1000, y1 = Math.ceil(Math.max(...ys) / 1000) * 1000;
    const W = 640, H = 340, m = { l: 56, r: 20, t: 30, b: 40 };
    const X = v => m.l + (v - x0) / (x1 - x0) * (W - m.l - m.r), Y = v => H - m.b - (v - y0) / (y1 - y0) * (H - m.t - m.b);
    let g = `<svg viewBox="0 0 ${W} ${H}" width="100%">`;
    for (let t = y0; t <= y1; t += 1000) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="${css('--grid')}"/><text x="${m.l - 8}" y="${Y(t) + 4}" text-anchor="end" font-size="11" fill="${css('--ink-3')}">${fmt(t)}</text>`;
    for (let t = Math.ceil(x0 / 50) * 50; t <= x1; t += 50) g += `<text x="${X(t)}" y="${H - m.b + 16}" text-anchor="middle" font-size="11" fill="${css('--ink-3')}">${t}</text>`;
    g += `<text x="${(m.l + W - m.r) / 2}" y="${H - 4}" text-anchor="middle" font-size="11.5" fill="${css('--ink-2')}">CO₂ (kg/m³) · lower is better</text><text x="12" y="${m.t - 12}" font-size="11.5" fill="${css('--ink-2')}">28-day strength (psi)</text>`;
    ex.forEach(p => g += `<circle cx="${X(p.gwp)}" cy="${Y(p.psi)}" r="4" fill="${css('--ink-3')}" opacity=".5"><title>${esc(p.mix)}: ${fmt(p.psi)} psi, ${p.gwp} kg CO₂/m³</title></circle>`);
    pr.forEach((p, i) => g += `<circle cx="${X(p.gwp)}" cy="${Y(p.pred_psi)}" r="6" fill="${css('--accent')}"/><text x="${X(p.gwp) + 9}" y="${Y(p.pred_psi) + 4}" font-size="12" font-weight="500" fill="${css('--ink')}">P-${i + 1}</text>`);
    g += `</svg>`;
    const fixed = Object.entries(pr[0]?.fixed || {}).map(([k, v]) => `${label(k).toLowerCase()} ${v}${k.includes('%') ? '%' : ''}`).join(', ');
    const best = pr.length ? Math.max(...pr.map(p => p.co2_saving)) : 0;
    return `<h2>What model ${esc(d.model)} gives you</h2>
    <p class="lead">Grey dots are your ${d.compared_with} mixes${fixed ? ' at similar ' + esc(fixed.split(' ')[0] + ' ' + fixed.split(' ')[1]) : ''}. Teal are mixes the model expects to reach the same strength with up to <b>${pct(best)} less CO₂</b>. Test these next.</p>
    <div class="card">${g}<div class="legend"><span><i style="background:${css('--ink-3')};opacity:.5"></i>your mixes</span><span><i style="background:${css('--accent')}"></i>proposed</span></div></div>
    <div class="card scroll-x" style="padding:4px 10px"><table>
      <tr><th>Mix</th><th class="num">Cement</th><th class="num">Fly ash</th><th class="num">Slag</th><th class="num">Water</th><th class="num">Predicted 28-day</th><th class="num">CO₂</th><th class="num">vs your mix</th></tr>
      ${pr.map((p, i) => `<tr><td class="mono">P-${i + 1}</td><td class="num">${p.mix_lb_yd3.Cement}</td><td class="num">${p.mix_lb_yd3['Fly Ash']}</td><td class="num">${p.mix_lb_yd3.Slag}</td><td class="num">${p.mix_lb_yd3.Water}</td><td class="num">${fmt(p.pred_psi)} ± ${fmt(p.sd_psi)}</td><td class="num">${p.gwp}</td><td class="num">−${pct(p.co2_saving)} vs ${esc(p.compare_to)}</td></tr>`).join('')}
    </table></div>
    <p class="note">Quantities in lb/yd³${fixed ? ', ' + esc(fixed) : ''}. CO₂ in kg CO₂e per m³. Predictions are lab-cured; your QC engineer signs off.</p>`;
  }},
};

// strength gain: one line per mix over test age (log-spaced so 3 and 7 days don't crowd), median on top
function strengthChart(curves, ages) {
  const ys = curves.flatMap(c => c.points.map(p => p[1]));
  const y0 = Math.floor(Math.min(...ys) / 1000) * 1000, y1 = Math.ceil(Math.max(...ys) / 1000) * 1000;
  const W = 640, H = 300, m = { l: 56, r: 64, t: 30, b: 40 };
  const lx = a => Math.log(a + 1), a0 = lx(Math.min(...ages)), a1 = lx(Math.max(...ages));
  const X = a => m.l + (lx(a) - a0) / (a1 - a0 || 1) * (W - m.l - m.r), Y = v => H - m.b - (v - y0) / (y1 - y0) * (H - m.t - m.b);
  const line = pts => pts.map(p => `${X(p[0])},${Y(p[1])}`).join(' ');
  let g = `<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  for (let t = y0; t <= y1; t += 1000) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="${css('--grid')}"/><text x="${m.l - 8}" y="${Y(t) + 4}" text-anchor="end" font-size="11" fill="${css('--ink-3')}">${fmt(t)}</text>`;
  ages.forEach(a => g += `<text x="${X(a)}" y="${H - m.b + 16}" text-anchor="middle" font-size="11" fill="${css('--ink-3')}">${a} d</text>`);
  g += `<text x="${(m.l + W - m.r) / 2}" y="${H - 4}" text-anchor="middle" font-size="11.5" fill="${css('--ink-2')}">Age at test (days)</text><text x="12" y="${m.t - 12}" font-size="11.5" fill="${css('--ink-2')}">Strength (psi)</text>`;
  curves.forEach(c => g += `<polyline fill="none" stroke="${css('--ink-3')}" stroke-opacity=".35" stroke-width="1.2" points="${line(c.points)}"><title>${esc(c.mix)}: ${c.points.map(p => `${p[0]} d ${fmt(p[1])}`).join(' · ')} psi</title></polyline>`);
  const med = ages.map(a => {
    const v = curves.map(c => c.points.find(p => p[0] === a)?.[1]).filter(x => x != null).sort((p, q) => p - q);
    return v.length ? [a, v[Math.floor(v.length / 2)]] : null;
  }).filter(Boolean);
  g += `<polyline fill="none" stroke="${css('--accent')}" stroke-width="2.5" points="${line(med)}"/>`;
  med.forEach(p => g += `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4" fill="${css('--accent')}"/><text x="${X(p[0]) + 8}" y="${Y(p[1]) - 8}" font-size="12" font-weight="500" fill="${css('--ink')}">${fmt(p[1])}</text>`);
  return g + `</svg>`;
}

const UNIT_NOTE = { 'lb/yd3': 'lb/yd³ → kg/m³', 'gal/yd3': 'gal/yd³ → kg/m³', 'oz/cwt': 'oz/cwt → kg/m³', 'F': '°F → °C', 'MPa': 'MPa → psi' };
function convs(list) {
  const u = [...new Set(list.map(c => (c.match(/\[([^,\]]+)/) || [])[1]).filter(x => UNIT_NOTE[x]))];
  return u.length ? 'Converted ' + u.map(x => UNIT_NOTE[x]).join(', ') + '.' : '';
}

const order = ['data', 'training', 'results'];
function show(k) {
  cur = k;
  $('tabs').innerHTML = order.filter(o => art[o]).map(o => `<button class="ptab ${o === k ? 'on' : ''}" data-a="${o}">${A[o].t}</button>`).join('');
  $('pbody').innerHTML = art[k] ? A[k].render(art[k]) : '';
  document.querySelectorAll('.art').forEach(b => b.classList.toggle('on', b.dataset.a === k));
}

// ------------------------------------------------------------------ models
async function loadModels() {
  const { models } = await (await fetch('/api/models')).json();
  if (!models.length) { $('modelList').innerHTML = '<p class="blank">No models yet. Train one in Project.</p>'; return; }
  const last = models[models.length - 1].version;
  $('modelList').innerHTML = `<div class="card scroll-x" style="padding:4px 10px"><table>
    <tr><th>Version</th><th>Trained</th><th>Inputs</th><th class="num">Mixes</th><th class="num">28-day error</th><th></th></tr>
    ${models.slice().reverse().map(m => `<tr class="${m.version === last ? 'win' : ''}"><td>${esc(m.version)}${m.version === last ? ' <span class="tag new">latest</span>' : ''}</td>
      <td>${new Date(m.trained).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</td>
      <td>Meta's 10 inputs${m.extra_inputs.map(e => ' + ' + esc(label(e).toLowerCase())).join('')}</td>
      <td class="num">${m.mixes}</td><td class="num">${fmt(m.rmse_28d)} psi${m.gain ? ` <span style="color:var(--accent)">−${pct(m.gain)}</span>` : ''}</td>
      <td style="text-align:right"><button class="btn" style="padding:5px 12px" data-use="${esc(m.version)}">Use in chat</button></td></tr>`).join('')}
  </table></div>`;
}

// ------------------------------------------------------------------ session + events
function reset() {
  stream.innerHTML = ''; block = null; lastSeq = -1;
  for (const k of Object.keys(art)) delete art[k];
  for (const k of Object.keys(chips)) delete chips[k];
  cur = null; $('tabs').innerHTML = ''; $('pbody').innerHTML = '<p class="blank">Data, training and results appear here.</p>';
}
function connect(id) {
  sid = id; history.replaceState(null, '', '#' + id);
  if (es) es.close();
  es = new EventSource(`/api/sessions/${id}/events`);
  es.onerror = () => { if (es.readyState === EventSource.CLOSED) handlers.error({ text: 'This session is gone because the server restarted. Reload the page to start again.' }); };
  es.onmessage = m => {
    const e = JSON.parse(m.data);
    if (e.seq <= lastSeq) return;
    lastSeq = e.seq;
    handlers[e.type]?.(e);
  };
}
function emptyState(model) {
  const d = document.createElement('div'); d.className = 'empty';
  d.innerHTML = model
    ? `<div>Ask model ${esc(model)} about a mix, e.g. <i>what will R-101 reach at 7 days?</i></div>`
    : `<div>Upload your plant's Excel files: mix designs, cylinder breaks and QC logs.</div>
       <button class="btn" type="button" id="choose">Choose files</button>`;
  stream.append(d);
}
async function newSession(model) {
  reset();
  const r = await fetch('/api/sessions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model: model || null }) });
  connect((await r.json()).id);
  emptyState(model);
}
async function upload(files) {
  if (!files.length) return;
  if (!sid) await newSession();
  const fd = new FormData();
  for (const f of files) fd.append('files', f);
  const r = await fetch(`/api/sessions/${sid}/files`, { method: 'POST', body: fd });
  if (!r.ok) handlers.error({ text: (await r.json()).detail });
}

document.addEventListener('click', async e => {
  const a = e.target.closest('[data-a]'); if (a) show(a.dataset.a);
  const v = e.target.closest('[data-v]');
  if (v) { document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('on', b === v)); document.querySelectorAll('.view').forEach(x => x.classList.toggle('on', x.id === v.dataset.v)); if (v.dataset.v === 'models') loadModels(); }
  if (e.target.id === 'choose' || e.target.id === 'attach') $('picker').click();
  const inp = e.target.closest('button[data-input]');
  if (inp) {
    inp.disabled = true;
    const r = await fetch(`/api/sessions/${sid}/inputs`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: inp.dataset.input }) });
    if (!r.ok) { inp.disabled = false; handlers.error({ text: r.status === 409 ? 'Wait until MixPilot has finished, then try again.' : (await r.json()).detail }); }
  }
  if (e.target.id === 'train') {
    e.target.disabled = true; e.target.textContent = 'Training…';
    const r = await fetch(`/api/sessions/${sid}/train`, { method: 'POST' });
    if (!r.ok) { e.target.disabled = false; e.target.textContent = 'Train model'; handlers.error({ text: (await r.json()).detail }); }
  }
  const use = e.target.closest('[data-use]');
  if (use) { document.querySelector('[data-v=project]').click(); await newSession(use.dataset.use); }
});
$('picker').addEventListener('change', e => { upload([...e.target.files]); e.target.value = ''; });
$('composer').addEventListener('submit', async e => {
  e.preventDefault();
  const text = $('msg').value.trim();
  if (!text || busy) return;
  if (!sid) await newSession();
  $('msg').value = '';
  const r = await fetch(`/api/sessions/${sid}/messages`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
  if (!r.ok) handlers.error({ text: (await r.json()).detail });
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => cur && show(cur));
// a failed fetch means the server is down; say so instead of leaving an empty chat
addEventListener('unhandledrejection', e => { if (e.reason instanceof TypeError) handlers.error({ text: "Can't reach the MixPilot server. Start it, then reload the page." }); });

(async () => {
  const id = location.hash.slice(1);
  if (id && (await fetch(`/api/sessions/${id}`)).ok) connect(id);
  else { reset(); emptyState(); }
})();
</script>
