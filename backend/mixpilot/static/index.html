<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MixPilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------ tokens */
:root{
  --bg:#fff; --raise:#fff; --fill:#f5f5f4; --fill-2:#ededec; --line:#ececeb; --line-2:#dcdcda;
  --ink:#0b0b0b; --ink-2:#55554f; --ink-3:#71716b; --on-ink:#fff;
  --good:#0b7a5f; --good-soft:#0b7a5f14; --you:#b4540a; --you-soft:#b4540a12; --on-you:#fff;
  --mark-2:#c4c4c4; --grid:#f0f0ee; --bad:#b91c1c;
  --glass:rgba(255,255,255,.78); --ring:rgba(0,0,0,.07);
  --shadow:0 0 0 1px var(--ring),0 1px 2px rgba(0,0,0,.04),0 12px 40px -12px rgba(0,0,0,.16);
  --sans:'Geist',ui-sans-serif,system-ui,-apple-system,sans-serif; --mono:'Geist Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.23,1,.32,1); --ease-io:cubic-bezier(.77,0,.175,1); --ease-dr:cubic-bezier(.32,.72,0,1);
  --top:72px; --chatw:380px; --gap:12px;
}
[data-theme=dark]{
  --bg:#0c0c0b; --raise:#161615; --fill:#1b1b19; --fill-2:#262624; --line:#242422; --line-2:#34342f;
  --ink:#f4f4f2; --ink-2:#b4b4ad; --ink-3:#8d8d86; --on-ink:#0c0c0b;
  --good:#34d3a6; --good-soft:#34d3a618; --you:#f5a524; --you-soft:#f5a52414; --on-you:#0c0c0b;
  --mark-2:#5a5a5a; --grid:#1d1d1b; --bad:#f87171;
  --glass:rgba(22,22,21,.76); --ring:rgba(255,255,255,.09);
  --shadow:0 0 0 1px var(--ring),0 16px 48px -12px rgba(0,0,0,.7);
}
@media (max-width:1320px){:root{--chatw:348px}}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);overflow:hidden;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;color-scheme:light}
[data-theme=dark] body{color-scheme:dark}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3,p{margin:0}
svg{display:block}
.mono{font-family:var(--mono);font-size:.92em}
.muted{color:var(--ink-3)}
[hidden]{display:none!important}

/* ------------------------------------------------------------------ timeline */
.topbar{position:fixed;inset:0 0 auto 0;height:var(--top);padding:0 14px 0 16px;display:flex;align-items:center;gap:20px;
  border-bottom:1px solid var(--line);background:var(--bg);z-index:30}
.brand{flex:none;display:flex;align-items:center;gap:9px;height:30px;font-weight:600;letter-spacing:-.01em}
.mark{flex:none;width:20px;height:20px;border-radius:6px;background:var(--ink);position:relative;overflow:hidden}
.mark::after{content:"";position:absolute;inset:6px 4px 3px;border-radius:2px 2px 0 0;
  background:linear-gradient(90deg,var(--on-ink) 3px,transparent 3px 5px,var(--on-ink) 5px 8px,transparent 8px 10px,var(--on-ink) 10px)}
#phases{position:relative;flex:1;min-width:0}
.sel{position:absolute;left:0;top:0;width:0;height:52px;border-radius:12px;background:var(--fill);pointer-events:none;
  transition:transform 260ms var(--ease),width 260ms var(--ease)}
#phaseList{position:relative;display:flex;align-items:center}
.ph{flex:none;display:flex;align-items:center;gap:10px;height:52px;padding:0 12px 0 9px;text-align:left;border-radius:12px}
.ph[aria-disabled=true]{cursor:default}
.ph .g{flex:none;width:26px;height:26px}
.ph .nm{display:block;font-weight:550;letter-spacing:-.012em;line-height:17px;font-size:14px}
.ph .sb{display:block;font-size:12px;color:var(--ink-3);line-height:15px;margin-top:1px;white-space:nowrap}
.ph.locked .nm{color:var(--ink-3);font-weight:450}
.ph.waiting .sb{color:var(--you)}
.ph-t{min-width:0}
.ln{flex:1;min-width:10px;height:1px;background:var(--line-2)}
.ln.done{background:var(--ink)}
@media (hover:hover) and (pointer:fine){.ph:not([aria-disabled=true]):hover{background:var(--fill)}}
.navi{flex:none;display:flex;align-items:center;gap:8px;height:36px;padding:0 12px 0 9px;border-radius:10px;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}
.navi.on{background:var(--fill);color:var(--ink)}
.navi .g{display:grid;place-items:center}
@media (hover:hover) and (pointer:fine){.navi:hover{background:var(--fill)}}
@media (max-width:1180px){.ph .sb{display:none}.brand span{display:none}.ph{gap:8px}}
@media (max-width:860px){.ph:not([aria-current]) .ph-t{display:none}.ph{padding:0 9px}}

/* ------------------------------------------------------------------ stage */
.stage{position:fixed;inset:var(--top) 0 0 0;overflow:auto;scrollbar-gutter:stable}
.view{padding:44px 56px 132px calc(var(--chatw) + var(--gap) + 56px);min-height:100%}
body.chat-off .view,body[data-layer=over] .view{padding-left:56px}
.inner{max-width:880px;margin:0 auto}
.enter>*{animation:rise 420ms var(--ease) both}
.enter>*:nth-child(2){animation-delay:50ms}.enter>*:nth-child(3){animation-delay:100ms}.enter>*:nth-child(4){animation-delay:150ms}.enter>*:nth-child(5){animation-delay:200ms}.enter>*:nth-child(n+6){animation-delay:240ms}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.reflow{animation:fade 220ms ease-out}
@keyframes fade{from{opacity:.4}to{opacity:1}}

.hd{margin-bottom:36px}
.kick{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-3);margin-bottom:12px}
.kick .n{font-family:var(--mono);color:var(--ink);font-size:12px}
.kick i{width:3px;height:3px;border-radius:50%;background:var(--line-2)}
h1{font-size:60px;line-height:1.02;letter-spacing:-.045em;font-weight:600;text-wrap:balance}
h1 span{font-weight:300;color:var(--ink-3);letter-spacing:-.04em}
.lede{margin-top:14px;font-size:16px;line-height:1.5;color:var(--ink-2);max-width:600px;text-wrap:pretty}
h2{font-size:18px;font-weight:550;letter-spacing:-.018em}
.sec{margin-top:44px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:14px}
.sec-h p{font-size:13px;color:var(--ink-3)}
.fine{font-size:12.5px;line-height:1.5;color:var(--ink-3);text-wrap:pretty}
.card{border:1px solid var(--line);border-radius:18px;background:var(--raise)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:10px;font-weight:500;letter-spacing:-.01em;transition:transform 140ms var(--ease),opacity 140ms ease,background-color 140ms ease;white-space:nowrap}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.pri{background:var(--ink);color:var(--on-ink)}
.btn.sec-b{border:1px solid var(--line-2);background:var(--raise)}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.btn.lg{height:48px;padding:0 24px;font-size:15px;border-radius:12px}
@media (hover:hover) and (pointer:fine){.btn.pri:not(:disabled):hover{opacity:.84}.btn.sec-b:not(:disabled):hover{background:var(--fill)}}
.link{color:var(--ink);font-weight:500;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
@media (hover:hover) and (pointer:fine){.link:hover{text-decoration-color:var(--ink)}}

/* tags */
.tag{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.tag.add{background:var(--good-soft)}.tag.add::before{background:var(--good)}
.tag.you{background:var(--you-soft)}.tag.you::before{background:var(--you)}
.tag.no{background:var(--fill);color:var(--ink-2)}.tag.no::before{background:var(--ink-3)}

/* ------------------------------------------------------------------ upload */
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;height:300px;text-align:center;border:1px solid var(--line-2);border-radius:22px;transition:background-color 160ms ease,border-color 160ms ease}
.drop .ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--on-ink);margin-bottom:14px;transition:transform 200ms var(--ease)}
.drop b{font-size:18px;font-weight:550;letter-spacing:-.02em}
.drop span{color:var(--ink-3);font-size:13.5px}
.drop.compact{height:96px;flex-direction:row;gap:12px;border-radius:16px;margin-bottom:0}
.drop.compact .ic{width:32px;height:32px;margin:0}.drop.compact b{font-size:14px;font-weight:500;letter-spacing:-.01em}
.drop.over{background:var(--fill);border-color:var(--ink)}.drop.over .ic{transform:translateY(-4px)}
@media (hover:hover) and (pointer:fine){.drop:hover{background:var(--fill)}}
.alt{display:flex;align-items:center;gap:20px;margin-top:20px}
.files{margin-top:14px}
.frow{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow .x{width:32px;height:32px;flex:none;border-radius:8px;background:var(--fill);display:grid;place-items:center;font:500 9.5px var(--mono);color:var(--ink-2)}
.frow b{font-weight:500}
.frow small{display:block;font-size:12.5px;color:var(--ink-3)}
.frow .r{margin-left:auto;font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.pop{animation:rise 320ms var(--ease) both}

/* ------------------------------------------------------------------ prepare */
.steps{border-top:1px solid var(--line)}
.step{border-bottom:1px solid var(--line)}
.step-h{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:12px 0;text-align:left}
.step-h[disabled]{color:var(--ink-3)}
.step-g{flex:none;width:24px;height:24px}
.step-h .tt{font-size:17px;font-weight:550;letter-spacing:-.02em}
.step-h[disabled] .tt{font-weight:450}
.step-h .own{display:block;font-size:12.5px;color:var(--ink-3);font-weight:400;letter-spacing:0}
.step-h .sum{margin-left:auto;font-size:13px;color:var(--ink-2);text-align:right;white-space:nowrap}
.step-h .chev{flex:none;color:var(--ink-3);transition:transform 180ms var(--ease)}
.step.open .chev{transform:rotate(180deg)}
.step-b{padding:2px 0 26px 38px}
.now{display:flex;align-items:center;gap:9px;margin-bottom:12px;font-size:13px;color:var(--ink-2)}
.turn{transform-origin:12px 12px;animation:spin .9s linear infinite}
.dots{display:inline-flex;gap:3px}
.dots i{width:3px;height:3px;border-radius:50%;background:currentColor;animation:dot 1s infinite}
@keyframes dot{0%,60%,100%{opacity:.25}30%{opacity:1}}
.rows .rw{scroll-margin-bottom:96px;display:grid;align-items:center;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.rows .rw:last-child{border-bottom:0}
.rw.map{grid-template-columns:minmax(0,1.2fr) 16px minmax(0,1fr) 124px}
.rw.map>:last-child{text-align:right}
.rw.file{grid-template-columns:minmax(0,1fr) auto}
.rw.test{grid-template-columns:minmax(0,190px) 96px minmax(0,1fr)}
.rw .tag{justify-self:start}
.rw .arr{color:var(--ink-3)}
.rw .why{color:var(--ink-2);font-size:13px;text-wrap:pretty}
.rw .raw{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw.pending{color:var(--ink-3)}
.fall{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px}
.fall .rw{grid-template-columns:minmax(0,1fr) auto}
.fall .tot{font-weight:550}
.notes{display:flex;flex-direction:column;gap:9px;font-size:13px;color:var(--ink-2)}
.notes li{display:flex;gap:9px;list-style:none;text-wrap:pretty}
.notes{padding:0;margin:0}
.notes li::before{content:"";flex:none;width:5px;height:5px;margin-top:7px;border-radius:50%;background:var(--ink-3)}
.notes li.warn::before{background:var(--you)}
.sub-cap{font-size:12px;color:var(--ink-3);margin:0 0 6px}

/* ------------------------------------------------------------------ review */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.stat b{display:block;font-size:30px;font-weight:500;letter-spacing:-.035em;line-height:1.1}
.stat span{display:block;margin-top:5px;font-size:12.5px;color:var(--ink-3)}
.decide{margin-top:36px;padding:26px 28px;border-radius:20px;background:var(--raise);box-shadow:0 0 0 1px var(--you),0 0 0 5px var(--you-soft)}
.decide.settled{box-shadow:0 0 0 1px var(--line);padding:18px 22px}
.decide-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.decide h2{font-size:22px;letter-spacing:-.028em}
.decide p{margin-top:6px;color:var(--ink-2);max-width:600px;text-wrap:pretty}
.strip{display:flex;gap:2px;height:36px;margin-top:22px;align-items:stretch}
.strip i{flex:1;min-width:1px;border-radius:1.5px;background:var(--fill-2)}
.strip i.has{background:var(--ink)}
.strip-k{display:flex;justify-content:space-between;margin-top:7px;font-size:12px;color:var(--ink-3);position:relative;height:17px}
.strip-k em{position:absolute;font-style:normal;color:var(--ink);font-weight:500;transform:none}
.decide-ft{display:flex;align-items:center;gap:10px;margin-top:22px;flex-wrap:wrap}
.decide-ft .mt{margin-left:auto;font-size:13px;color:var(--ink-3);text-align:right}
.decide-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.decide-row b{font-weight:550}
.inputs{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;height:30px;padding:0 11px;border-radius:8px;background:var(--fill);font-size:13px;color:var(--ink-2)}
.chip.new{background:var(--ink);color:var(--on-ink);font-weight:500}
.chip.maybe{background:none;box-shadow:inset 0 0 0 1px var(--you);color:var(--ink)}
.plus{display:flex;align-items:center;gap:10px;margin:14px 0 10px;font-size:12.5px;color:var(--ink-3)}
.plus::after{content:"";flex:1;height:1px;background:var(--line)}
.cta{position:sticky;bottom:20px;margin-top:40px;display:flex;align-items:center;gap:16px;padding:12px 12px 12px 22px;border-radius:18px;background:var(--glass);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);box-shadow:var(--shadow);z-index:4}
.cta .t{min-width:0;font-size:13px;color:var(--ink-3);line-height:1.35}
.cta .t b{display:block;color:var(--ink);font-size:14px;font-weight:550}
.cta .btn{margin-left:auto}
.disc{margin-top:28px}
.disc summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;font-weight:500;padding:6px 0}
.disc summary::-webkit-details-marker{display:none}
.disc summary svg{color:var(--ink-3);transition:transform 180ms var(--ease)}
.disc[open] summary svg{transform:rotate(180deg)}

/* ------------------------------------------------------------------ train */
.hero-n{display:flex;align-items:flex-end;gap:40px;flex-wrap:wrap}
.big{font-size:88px;line-height:.95;font-weight:500;letter-spacing:-.055em}
.big small{font-size:22px;font-weight:400;letter-spacing:-.02em;color:var(--ink-3);margin-left:6px}
.big-l{margin-top:12px;font-size:13.5px;color:var(--ink-2);max-width:280px;text-wrap:pretty}
.rounds{margin-top:36px}
.pills{display:flex;justify-content:space-between;height:44px}
.pills i{width:14px;border-radius:99px;background:var(--fill-2);transition:background-color 200ms ease}
.pills i.on{background:var(--ink)}
.pills i.cur{background:var(--ink);animation:breathe 1.1s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.3}}
.pill-k{position:relative;height:18px;margin-top:9px;font-size:12px;color:var(--ink-3)}
.pill-k span{position:absolute;white-space:nowrap}
.pill-k .act{color:var(--ink);font-weight:500}
.now-line{margin-top:18px;font-size:14px;color:var(--ink-2);display:flex;align-items:center;gap:9px;min-height:21px}
.board .brow{display:grid;grid-template-columns:minmax(0,1fr) 92px minmax(120px,28%);gap:18px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.board .brow:last-child{border-bottom:0}
.brow .nm{font-weight:450;text-wrap:pretty}
.brow.win .nm{font-weight:600}
.brow small{display:block;font-size:12.5px;color:var(--ink-3);font-weight:400}
.brow .v{text-align:right;font-weight:500}
.brow .bar{height:8px;background:var(--fill);border-radius:0 4px 4px 0}
.brow .bar i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--mark-2)}
.brow.win .bar i{background:var(--good)}

/* ------------------------------------------------------------------ results */
.pay{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;margin-top:28px;padding-top:24px;border-top:1px solid var(--line)}
.pay .stat span{text-wrap:pretty}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:150px;padding:12px 14px;border-radius:12px;text-align:left;box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow 160ms ease,transform 140ms var(--ease)}
.seg button:active{transform:scale(.985)}
.seg button.on{box-shadow:inset 0 0 0 1.5px var(--ink)}
.seg b{display:flex;align-items:center;gap:7px;font-weight:550}
.seg b i{width:9px;height:9px;border-radius:50%;background:var(--good)}
.seg b em{font-style:normal;margin-left:auto;font-weight:500}
.seg small{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px}
.cmp{width:100%;border-collapse:collapse;font-size:13.5px}
.cmp th{font-size:12px;font-weight:450;color:var(--ink-3);text-align:right;padding:12px 20px;border-bottom:1px solid var(--line)}
.cmp td{padding:10px 20px;text-align:right;border-bottom:1px solid var(--line)}
.cmp tr:last-child td{border-bottom:0}
.cmp th:first-child,.cmp td:first-child{text-align:left;color:var(--ink-2)}
.cmp tr.key td{font-weight:550;color:var(--ink)}
.cmp .pos{font-weight:550}
.ask{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.ask p{flex:1;min-width:260px}

/* charts */
.chart{position:relative}
.chart svg{overflow:visible}
.chart text{font-family:var(--sans);font-variant-numeric:tabular-nums}
.ax{fill:var(--ink-3);font-size:11.5px}
.ax-t{fill:var(--ink-2);font-size:12px}
.gl{stroke:var(--grid);stroke-width:1}
.lbl{fill:var(--ink);font-size:12.5px;font-weight:550}
.lbl-2{fill:var(--ink-2);font-size:12px}
.m-ex{fill:var(--mark-2);stroke:var(--bg);stroke-width:2}
.m-ex.sel-m{fill:var(--ink)}
.m-pr{fill:var(--good);stroke:var(--bg);stroke-width:2;cursor:pointer}
.hit{fill:transparent;cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:18px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--mark-2)}
.legend i.pr{background:var(--good)}
.legend i.ink{background:var(--ink)}
.legend i.ln-k{width:16px;height:2px;border-radius:2px}
.chart.bleed{margin-top:8px}
#tip{position:fixed;z-index:60;pointer-events:none;padding:7px 10px;border-radius:9px;background:var(--ink);color:var(--on-ink);font-size:12px;line-height:1.4;max-width:260px;opacity:0;transition:opacity 100ms ease;white-space:pre-line}
#tip.on{opacity:1}

/* models */
.models .mrow{display:grid;grid-template-columns:90px minmax(0,1fr) 90px 110px auto;gap:18px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.models .mrow:last-child{border-bottom:0}
.models .mh{font-size:12px;color:var(--ink-3);padding-top:11px;padding-bottom:11px}
.empty{padding:64px 24px;text-align:center;color:var(--ink-3)}

/* ------------------------------------------------------------------ chapter veil */
.chapter{position:absolute;inset:0;z-index:5;background:var(--bg);display:flex;align-items:center;padding:0 56px 8vh calc(var(--chatw) + var(--gap) + 56px)}
body.chat-off .chapter,body[data-layer=over] .chapter{padding-left:56px}
.chapter-in{width:100%;max-width:880px;margin:0 auto}
.chapter .n{font:500 14px var(--mono);color:var(--ink-3);margin-bottom:14px}
.chapter h1{font-size:112px;letter-spacing:-.055em}
.chapter p{margin-top:18px;font-size:18px;color:var(--ink-2);max-width:560px}

/* ------------------------------------------------------------------ live chip */
.live{position:fixed;top:calc(var(--top) + 12px);right:24px;z-index:12;display:inline-flex;align-items:center;gap:9px;height:36px;padding:0 14px;border-radius:99px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--shadow);font-size:13px;font-weight:500;animation:rise 260ms var(--ease) both}
.live .d{width:7px;height:7px;border-radius:50%;background:var(--ink);animation:breathe 1.2s ease-in-out infinite}
.live .d.you{background:var(--you);animation:none}
.live .d.good{background:var(--good);animation:none}
.live .go{color:var(--ink-3);font-weight:400}

/* ------------------------------------------------------------------ chat overlay */
.chat{position:fixed;z-index:20;top:calc(var(--top) + var(--gap));bottom:var(--gap);left:var(--gap);width:var(--chatw);display:flex;flex-direction:column;border-radius:20px;
  background:var(--glass);backdrop-filter:blur(28px) saturate(1.5);-webkit-backdrop-filter:blur(28px) saturate(1.5);box-shadow:var(--shadow);
  transform-origin:bottom left;transition:transform 300ms var(--ease-dr),opacity 180ms ease,visibility 0s}
body.chat-off .chat{transform:translateY(10px) scale(.96);opacity:0;visibility:hidden;pointer-events:none;transition:transform 200ms var(--ease-dr),opacity 140ms ease,visibility 0s 200ms}
.chat-hd{display:flex;align-items:center;gap:11px;padding:14px 14px 12px 16px}
.chat-id{min-width:0;flex:1}
.chat-name{font-weight:550;letter-spacing:-.012em;line-height:18px}
.chat-status{font-size:12.5px;color:var(--ink-3);line-height:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2);transition:background-color 140ms ease,transform 140ms var(--ease)}
.ibtn:active{transform:scale(.94)}
@media (hover:hover) and (pointer:fine){.ibtn:hover{background:var(--fill)}}

.mixer{flex:none;display:block;width:30px;height:30px}
.mixer img{display:block;width:30px;height:30px}
@keyframes spin{to{transform:rotate(360deg)}}

.stream{flex:1;min-height:0;overflow:auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 14px,#000 calc(100% - 10px),transparent);mask-image:linear-gradient(to bottom,transparent,#000 14px,#000 calc(100% - 10px),transparent)}
.stream::-webkit-scrollbar{width:0}
.m-ag{font-size:14.5px;line-height:1.5;letter-spacing:-.005em;text-wrap:pretty}
.m-ag b{font-weight:600}
.m-you{align-self:flex-end;max-width:86%;padding:8px 12px;border-radius:14px 14px 4px 14px;background:var(--fill-2);font-size:14px}
.m-you .ffs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.m-you .ffs:first-child{margin-top:0}
.m-you .ff{font-size:12px;color:var(--ink-2)}
.agent{display:flex;flex-direction:column;gap:12px}
.agent .tools:empty,.agent .texts:empty,.agent .items:empty{display:none}
.agent .texts,.agent .items{display:flex;flex-direction:column;gap:10px}
.m-ag{margin:0}
.err{font-size:13px;color:var(--bad);text-wrap:pretty}
.ch{display:flex;align-items:center;gap:9px;width:100%;margin-top:6px;font-size:11.5px;color:var(--ink-3);text-align:left}
.ch:first-child{margin-top:0}
.ch b{font-weight:500;color:var(--ink-2)}
.ch::after{content:"";flex:1;height:1px;background:var(--line)}
.ch .n{font-family:var(--mono)}
.tools{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink-3)}
.tools div{display:flex;align-items:center;gap:8px}
.tools svg{flex:none;color:var(--ink-3)}
.tools .spin{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line-2);border-top-color:var(--ink);animation:spin .7s linear infinite;flex:none;margin:0 1px}
.tools.sum{color:var(--ink-3)}
.c-ask{padding:13px 14px;border-radius:14px;background:var(--raise);box-shadow:0 0 0 1px var(--you)}
.c-ask .h{font-weight:550;letter-spacing:-.012em;font-size:13.5px}
.c-ask .d{font-size:13px;color:var(--ink-2);margin:2px 0 10px;text-wrap:pretty}
.c-ask .b{display:flex;gap:6px}
.c-ask.ok{box-shadow:0 0 0 1px var(--line);display:flex;align-items:center;gap:9px;padding:10px 12px;font-size:13px}
.c-ask.ok .tag{margin-left:auto}
.sugg{display:flex;flex-direction:column;gap:5px;padding:0 14px 8px;align-items:flex-start}
.sugg button{padding:6px 11px;border-radius:9px;box-shadow:inset 0 0 0 1px var(--line-2);font-size:12.5px;color:var(--ink-2);text-align:left;transition:background-color 140ms ease,transform 140ms var(--ease);background:var(--raise)}
.sugg button:active{transform:scale(.98)}
@media (hover:hover) and (pointer:fine){.sugg button:hover{background:var(--fill)}}
.composer{display:flex;align-items:center;gap:4px;margin:0 10px 10px;padding:5px;border-radius:14px;background:var(--raise);box-shadow:0 0 0 1px var(--line-2);transition:box-shadow 140ms ease}
.composer:focus-within{box-shadow:0 0 0 1px var(--ink)}
.composer input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:14px;padding:0 4px;height:34px}
.composer input::placeholder{color:var(--ink-3)}
.send{flex:none;width:34px;height:34px;border-radius:10px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;transition:transform 140ms var(--ease),opacity 140ms ease}
.send:active:not(:disabled){transform:scale(.94)}
.send:disabled{opacity:.25}

.pillbar{position:fixed;z-index:20;bottom:16px;left:16px;width:320px;height:52px;display:flex;align-items:center;gap:10px;padding:0 8px 0 11px;border-radius:99px;text-align:left;
  background:var(--glass);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);box-shadow:var(--shadow);
  transition:transform 260ms var(--ease-dr),opacity 160ms ease,visibility 0s;transform-origin:bottom left}
body:not(.chat-off) .pillbar{transform:translateY(8px) scale(.96);opacity:0;visibility:hidden;pointer-events:none;transition:transform 160ms var(--ease-dr),opacity 100ms ease,visibility 0s 160ms}
.pillbar .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px;color:var(--ink-2)}
.pillbar .ex{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--ink-2);position:relative}
.pillbar .ex.un::after{content:"";position:absolute;top:0;right:0;width:9px;height:9px;border-radius:50%;background:var(--you);box-shadow:0 0 0 2px var(--bg)}
.pillbar:active{transform:scale(.985)}

@media (prefers-reduced-motion:reduce){
  .enter>*,.pop,.live{animation:fade 200ms ease-out both}
  .pills i.cur,.live .d{animation:none}
  .chat,.pillbar,body.chat-off .chat,body:not(.chat-off) .pillbar{transform:none!important}
  .stream{scroll-behavior:auto}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><i class="mark"></i><span>MixPilot</span></div>
  <div id="phases"><div class="sel" id="sel" hidden></div><nav id="phaseList" aria-label="Project phases"></nav></div>
  <button class="navi" id="navModels" data-go="models"><span class="g"><svg width="16" height="16" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M9 2.2 15.2 5.6 9 9 2.8 5.6 9 2.2Z"/><path d="M2.8 9 9 12.4 15.2 9M2.8 12.4 9 15.8l6.2-3.4"/></svg></span><span>Models</span></button>
</header>

<main class="stage" id="stage">
  <div class="view" id="view"></div>
  <div class="chapter" id="chapter" hidden></div>
</main>
<div id="liveSlot"></div>

<section class="chat" id="chat" aria-label="Chat with MixPilot">
  <header class="chat-hd">
    <picture class="mixer"><source srcset="concrete-mixer-static.png" media="(prefers-reduced-motion: reduce)"><img src="concrete-mixer.png" width="30" height="30" alt=""></picture>
    <div class="chat-id"><div class="chat-name">MixPilot</div><div class="chat-status" id="status" aria-live="polite"></div></div>
    <button class="ibtn" id="collapse" title="Hide chat" aria-label="Hide chat"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m4 6 4 4 4-4"/></svg></button>
  </header>
  <div class="stream" id="stream"></div>
  <div class="sugg" id="sugg"></div>
  <form class="composer" id="composer" autocomplete="off">
    <button type="button" class="ibtn" id="attach" title="Add files" aria-label="Add files"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg></button>
    <input id="msg" type="text" aria-label="Message MixPilot">
    <button class="send" id="send" aria-label="Send"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 12V2M2.8 6.2 7 2l4.2 4.2"/></svg></button>
  </form>
</section>
<button class="pillbar" id="pill" aria-label="Show chat"><picture class="mixer"><source srcset="concrete-mixer-static.png" media="(prefers-reduced-motion: reduce)"><img src="concrete-mixer.png" width="30" height="30" alt=""></picture><span class="tx" id="pillText"></span><span class="ex" id="pillEx"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m4 10 4-4 4 4"/></svg></span></button>
<input type="file" id="picker" accept=".xlsx,.xls,.csv" multiple hidden>
<div id="tip" role="tooltip"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
const fmt = n => Math.round(n).toLocaleString('en-US');
const pct = x => Math.round(x * 100) + '%';
const day = (iso, opts = { month: 'short', day: 'numeric', year: 'numeric' }) => new Date(iso + 'T12:00').toLocaleDateString('en-US', opts);
const label = name => name.replace(/ \(.*\)$/, '');
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
// Re-rendered elements restart their CSS animation; a negative delay keeps it on the clock.
const sync = ms => `animation-delay:${-(performance.now() % ms)}ms`;
const dots = () => { const d = -(performance.now() % 1000); return `<span class="dots"><i style="animation-delay:${d}ms"></i><i style="animation-delay:${d + 150}ms"></i><i style="animation-delay:${d + 300}ms"></i></span>`; };

const I = {
  check: s => `<svg width="${s}" height="${s}" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m3 7.4 2.7 2.7L11 4.6"/></svg>`,
  chev: `<svg class="chev" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m4 6 4 4 4-4"/></svg>`,
  arrow: `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7h9M8 3.5 11.5 7 8 10.5"/></svg>`,
  up: `<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 15V5M5.5 9.5 10 5l4.5 4.5"/></svg>`,
};

// ------------------------------------------------------------------ phases
const PH = [
  { k: 'upload', n: 1, name: 'Upload', rest: 'your files', who: 'You', tag: 'Bring the files your plant already keeps.' },
  { k: 'prepare', n: 2, name: 'Prepare', rest: 'your data', who: 'Muse Spark and our code', tag: 'Reading, mapping, cleaning, and testing every column.' },
  { k: 'review', n: 3, name: 'Review', rest: 'what goes in', who: 'You and Muse Spark', tag: 'What the data can support, and what needs your call.' },
  { k: 'train', n: 4, name: 'Train', rest: 'on your plant', who: 'Our code, no LLM', tag: 'Every setup is tested on mixes it never saw.' },
  { k: 'results', n: 5, name: 'Results', rest: 'for your model', who: 'Your model, explained by Muse Spark', tag: 'What the model gives you, and what to test next.' },
];
const ORDER = PH.map(p => p.k);
const byK = k => PH.find(p => p.k === k);
const META_INPUTS = ['Cement', 'Fly ash', 'Slag', 'Water', 'HRWR', 'Fine aggregate', 'Coarse aggregate', 'Material source', 'Curing temperature', 'Age'];
const PREP_TOOLS = ['read_files', 'map_columns', 'validate_data', 'suggest_inputs'];

// ------------------------------------------------------------------ state
let sid = null, es = null, lastSeq = -1, block = null, sessionModel = null;
let chatOpen = true, liveEvent = false, models = [];
const fresh = () => ({
  live: 'upload', view: 'upload', seen: { upload: true }, pending: [], files: [], uploading: false, busy: null, canTrain: false,
  art: {}, cards: [], decisions: {}, editing: {}, prep: { step: -1, open: -1, note: '', stopped: false }, train: { note: '', failed: false },
  sel: 0, leftOpen: false, asked: new Set(), unread: false, lastMsg: '', status: '',
});
let S = fresh();

const offered = () => S.cards.filter(c => c.kind === 'input_incomplete');
const undecided = () => offered().filter(c => !S.decisions[c.input]);
const trained = () => S.art.training?.status === 'done';

// ------------------------------------------------------------------ timeline
function phaseState(k) {
  const i = ORDER.indexOf(k), li = ORDER.indexOf(S.live);
  if (i > li) return 'locked';
  if (i < li) return 'done';
  if (k === 'upload') return 'active';
  if (k === 'prepare') return S.prep.stopped ? 'waiting' : 'running';
  if (k === 'review') return undecided().length ? 'waiting' : 'ready';
  if (k === 'train') return trained() ? 'done' : S.train.failed ? 'waiting' : 'running';
  return 'done';
}
function phaseSub(k, st) {
  const T = S.art.training, D = S.art.data;
  if (k === 'upload') { const n = S.files.length || S.pending.length; return n ? `${n} file${n > 1 ? 's' : ''}` : 'Excel or CSV'; }
  if (k === 'prepare') {
    if (st === 'locked') return 'Clean and test';
    if (st === 'waiting') return 'Stopped, see chat';
    if (st === 'running') return S.prep.step >= 0 ? STEPS[Math.min(S.prep.step, 3)].short : 'Starting';
    return D ? `${D.mixes} mixes · ${D.batches} batches` : 'Done';
  }
  if (k === 'review') {
    if (st === 'locked') return 'Your decisions';
    const n = undecided().length;
    if (st === 'waiting') return `${n} decision${n > 1 ? 's' : ''} for you`;
    const added = D ? D.coverage.filter(r => r.status === 'new').length : 0;
    return added ? `${added} new input${added > 1 ? 's' : ''}` : "Meta's 10 inputs";
  }
  if (k === 'train') {
    if (st === 'locked') return 'Compare setups';
    if (st === 'waiting') return 'Stopped, see chat';
    if (st === 'running') return !T ? 'Starting' : T.done >= T.total ? 'Saving the model' : `Round ${T.done + 1} of ${T.total}`;
    return T?.gain > 0 ? `${pct(T.gain)} more accurate` : 'Compared setups';
  }
  if (st === 'locked' || !S.art.results) return 'Mixes to test next';
  const best = bestSaving();
  return best ? `Up to ${pct(best)} less CO₂` : `Model ${esc(S.art.results.model)}`;
}
function glyph(k, st, n) {
  const R = 11.5, C = 2 * Math.PI * R;
  const num = (c, w = 500) => `<text x="13" y="17" text-anchor="middle" font-size="11.5" font-weight="${w}" font-family="var(--mono)" fill="${c}">${n}</text>`;
  if (st === 'done') return `<svg width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="12" fill="var(--ink)"/><path d="m8.2 13.3 3.3 3.3 6.3-6.6" fill="none" stroke="var(--on-ink)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  if (st === 'running') {
    const T = S.art.training, p = k === 'prepare' ? (S.prep.step + 1) / 4 : T ? (T.done + 1) / (T.total + 1) : 0;
    return `<svg width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="${R}" fill="var(--bg)" stroke="var(--line-2)" stroke-width="1.5"/><circle cx="13" cy="13" r="${R}" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - Math.max(.04, p))}" transform="rotate(-90 13 13)"/>${num('var(--ink)')}</svg>`;
  }
  if (st === 'waiting') return `<svg width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="12" fill="var(--you)"/>${num('var(--on-you)', 600)}</svg>`;
  if (st === 'ready' || st === 'active') return `<svg width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="${R}" fill="var(--bg)" stroke="var(--ink)" stroke-width="1.5"/>${num('var(--ink)')}</svg>`;
  return `<svg width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="${R}" fill="var(--bg)" stroke="var(--line-2)" stroke-width="1"/>${num('var(--ink-3)')}</svg>`;
}
function renderTimeline() {
  $('phaseList').innerHTML = PH.map(p => {
    const st = phaseState(p.k), locked = st === 'locked';
    return `<button class="ph ${st}" data-go="${p.k}" ${locked ? 'aria-disabled="true" tabindex="-1"' : ''} ${S.view === p.k ? 'aria-current="page"' : ''} title="${locked ? 'Unlocks when the phase before it is done' : p.name}"><span class="g">${glyph(p.k, st, p.n)}</span><span class="ph-t"><span class="nm">${p.name}</span><span class="sb">${phaseSub(p.k, st)}</span></span></button>${p.n < PH.length ? `<i class="ln ${st === 'done' ? 'done' : ''}"></i>` : ''}`;
  }).join('');
  const cur = document.querySelector('.ph[aria-current]');
  $('sel').hidden = !cur;
  if (cur) { $('sel').style.width = cur.offsetWidth + 'px'; $('sel').style.transform = `translateX(${cur.offsetLeft}px)`; }
  $('navModels').classList.toggle('on', S.view === 'models');
}

// ------------------------------------------------------------------ views
function head(p, lede, rest = p.rest) {
  return `<header class="hd"><div class="kick"><span class="n">Phase ${p.n} of 5</span><i></i><span>${p.who}</span></div><h1>${p.name} <span>${esc(rest)}</span></h1><p class="lede">${lede}</p></header>`;
}
const blank = text => `<div class="card empty">${text}</div>`;
const size = n => n < 1024 * 1024 ? `${Math.max(1, Math.round(n / 1024))} KB` : `${(n / 1024 / 1024).toFixed(1)} MB`;
const ext = name => esc(name.split('.').pop().toUpperCase());

const VIEWS = {
  upload() {
    const started = S.live !== 'upload', P = S.art.prep;
    if (sessionModel && !started && !S.pending.length) return `${head(byK('upload'), `This chat works with model ${esc(sessionModel)}. Ask about one of your mixes, or add files to start a new project.`)}<button class="drop compact" id="drop" data-act="pick"><span class="ic">${I.up}</span><b>Add files</b></button>`;
    const has = S.pending.length > 0;
    const rows = started
      ? (P?.files || S.files.map(file => ({ file }))).map(f => `<div class="frow"><span class="x">${ext(f.file)}</span><span><b>${esc(f.file)}</b>${f.sheet ? `<small>${esc(f.sheet)} sheet · ${fmt(f.rows)} rows · ${f.columns} columns</small>` : ''}</span></div>`)
      : S.pending.map((f, i) => `<div class="frow"><span class="x">${ext(f.name)}</span><span><b>${esc(f.name)}</b></span><span class="r">${size(f.size)}</span><button class="link" style="margin-left:14px;font-weight:400;font-size:12.5px" data-remove="${i}">Remove</button></div>`);
    return `${head(byK('upload'), started ? 'These are the files this project was built from.' : 'Mix designs, cylinder breaks and QC logs, in whatever layout your plant uses. MixPilot works out the rest.')}
    ${started ? '' : `<button class="drop ${has ? 'compact' : ''}" id="drop" data-act="pick"><span class="ic">${I.up}</span><b>${has ? 'Add more files' : 'Drop Excel or CSV files here'}</b>${has ? '' : '<span>or click to choose. One workbook or several files, US or metric units.</span>'}</button>`}
    ${rows.length ? `<div class="card files">${rows.join('')}</div>` : ''}
    ${has && !started ? `<div class="alt"><button class="btn pri lg" data-act="start" ${S.uploading ? 'disabled' : ''}>${S.uploading ? 'Uploading…' : `Start preparing ${I.arrow}`}</button><span class="muted">About 1.5 minutes</span></div>` : ''}
    <p class="fine" style="margin-top:28px;max-width:560px">Your files stay on this machine. Muse Spark sees column names, up to 12 sample values per column, and the results our code computes. Full rows aren't sent.</p>`;
  },

  prepare() {
    const P = S.prep;
    const lede = P.stopped ? "MixPilot stopped here. The chat says what's missing, and you can add files there." : S.live === 'prepare' ? 'Muse Spark reads the sheets and writes the mapping. Our code does every conversion and every number.' : 'What happened to your files before anything reached the model. Open a step to check it.';
    return `${head(byK('prepare'), lede)}<div class="steps">${STEPS.map((st, i) => {
      const done = i < P.step, now = i === P.step, off = i > P.step || P.step < 0, open = P.open === i && !off, spin = now && !P.stopped;
      const g = done ? `<svg class="step-g" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="var(--ink)"/><path d="m7.6 12.2 3 3 5.8-6.1" fill="none" stroke="var(--on-ink)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`
        : spin ? `<svg class="step-g" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="none" stroke="var(--line-2)" stroke-width="1.5"/><path class="turn" style="${sync(900)}" d="M12 1.5a10.5 10.5 0 0 1 10.5 10.5" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linecap="round"/></svg>`
        : now ? `<svg class="step-g" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="var(--you)"/></svg>`
        : `<svg class="step-g" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="none" stroke="var(--line-2)"/></svg>`;

// ------------------------------------------------------------------ charts
const content = () => {

function curves(d) {

  const ys = c.flatMap(x => x.points.map(p => p[1])), y0 = Math.floor(Math.min(...ys) / 1000) * 1000, y1 = Math.ceil(Math.max(...ys) / 1000) * 1000;
  const lx = a => Math.log(a + 1), a0 = lx(ages[0]), a1 = lx(ages[ages.length - 1]);

  for (let t = y0; t <= y1; t += 2000) g += `<line class="gl" x1="${m.l}" x2="${W - m.r + 40}" y1="${Y(t)}" y2="${Y(t)}"/><text class="ax" x="${m.l - 8}" y="${Y(t) + 4}" text-anchor="end">${t / 1000}K</text>`;
  ages.forEach(a => g += `<text class="ax" x="${X(a)}" y="${H - m.b + 18}" text-anchor="middle">${a} days</text>`);
  c.forEach(x => {
    const pts = x.points.map(p => `${X(p[0])},${Y(p[1])}`).join(' ');
    g += `<polyline points="${pts}" fill="none" stroke="var(--mark-2)" stroke-width="1.25"/><polyline points="${pts}" fill="none" stroke="transparent" stroke-width="10" data-tip="${esc(x.mix)}\n${x.points.map(p => `${p[0]} days: ${fmt(p[1])} psi`).join('\n')}"/>`;
  });
  const med = ages.map(a => { const v = c.map(x => x.points.find(p => p[0] === a)?.[1]).filter(x => x != null).sort((p, q) => p - q); return v.length ? [a, v[Math.floor(v.length / 2)]] : null; }).filter(Boolean);
  g += `<polyline points="${med.map(p => `${X(p[0])},${Y(p[1])}`).join(' ')}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" pointer-events="none"/>`;
  med.forEach((p, i) => g += `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4" fill="var(--ink)" stroke="var(--bg)" stroke-width="2"/>${i === med.length - 1 ? `<text class="lbl" x="${X(p[0]) + 9}" y="${Y(p[1]) + 4}">${fmt(p[1])}</text>` : ''}`);

function searchChart(search, total) {

  let g = `<svg width="${W}" height="${H}" role="img" aria-label="28-day error of each round's try">`;
  for (let t = y0; t <= y1; t += step) g += `<line class="gl" x1="${m.l}" x2="${W - m.r + 40}" y1="${Y(t)}" y2="${Y(t)}"/><text class="ax" x="${m.l - 8}" y="${Y(t) + 4}" text-anchor="end">${fmt(t)}</text>`;
  [1, 4, 8, total - 1].forEach(r => g += `<text class="ax" x="${X(r)}" y="${H - m.b + 18}" text-anchor="middle">Round ${r}</text>`);
  const series = (key, color) => {

  const r = await fetch(`/api/sessions/${sid}/files`, { method: 'POST', body: fd });

  const sel = t.closest('[data-sel]'); if (sel) { S.sel = +sel.dataset.sel; renderView(false); return renderComposer(); }
  const q = t.closest('[data-say]'); if (q) return send(q.dataset.say);
  const ask = t.closest('[data-ask]'); if (ask) { openChat(true); $('msg').value = `What does ${ask.dataset.ask} reach at 7 days?`; return $('msg').focus(); }
  const rm = t.closest('[data-remove]'); if (rm) { S.pending.splice(+rm.dataset.remove, 1); return renderAll(false); }
  const use = t.closest('[data-use]');
  if (use) {
    if (use.dataset.use !== sessionModel) await newSession(use.dataset.use);
    else if (S.art.results) go('results');
    openChat(true); return $('msg').focus();
  }
  const act = t.closest('[data-act]');
  if (act) {
    const a = act.dataset.act;
    if (a === 'pick') $('picker').click();
    if (a === 'start') upload([...S.pending]);
    if (a === 'train') startTraining();
  }
});
document.addEventListener('toggle', e => { if (e.target.id === 'leftOut') S.leftOpen = e.target.open; }, true);
$('attach').addEventListener('click', () => $('picker').click());
$('picker').addEventListener('change', e => { addFiles([...e.target.files]); e.target.value = ''; });
function bindDrop() {
  const z = $('drop'); if (!z) return;
  ['dragenter', 'dragover'].forEach(n => z.addEventListener(n, e => { e.preventDefault(); z.classList.add('over'); }));
  z.addEventListener('dragleave', () => z.classList.remove('over'));
  z.addEventListener('drop', e => { e.preventDefault(); addFiles([...e.dataTransfer.files]); });
}
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());
$('composer').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('msg').value.trim();
  if (!v || S.busy) return;
  $('msg').value = '';
  send(v);
});

function openChat(open) {
  chatOpen = open;
  document.body.classList.toggle('chat-off', !open);
  if (open) { S.unread = false; scrollChat(); }
  renderStatus();
  renderView(true);
  $('view').firstChild?.classList.remove('enter');
  if (!reduced()) $('view').firstChild?.classList.add('reflow');
  $(open ? 'collapse' : 'pill').focus({ preventScroll: true });
}
$('collapse').addEventListener('click', () => openChat(false));
$('pill').addEventListener('click', () => { openChat(true); if (!S.busy) $('msg').focus({ preventScroll: true }); });

// tooltips: a mark's hit target says what it is
const tip = $('tip');
document.addEventListener('pointermove', e => {
  const t = e.target.closest?.('[data-tip]');
  if (!t) { tip.classList.remove('on'); return; }
  tip.textContent = t.dataset.tip;
  tip.classList.add('on');
  const r = tip.getBoundingClientRect(), x = Math.min(e.clientX + 14, innerWidth - r.width - 10), y = e.clientY - r.height - 12;
  tip.style.left = x + 'px'; tip.style.top = (y < 8 ? e.clientY + 16 : y) + 'px';
});

// 1-5 switch phases, / goes to the chat. No animation on these: they are used often.
document.addEventListener('keydown', e => {
  if (e.target.matches?.('input') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^[1-5]$/.test(e.key)) { const k = ORDER[+e.key - 1]; if (phaseState(k) !== 'locked' && S.view !== k) { S.view = k; S.seen[k] = true; renderAll(false); } }
  if (e.key === '/') { e.preventDefault(); openChat(true); $('msg').focus(); }
});
function fitLayout() {
  document.body.dataset.layer = innerWidth < 1000 ? 'over' : 'beside';  // too narrow to sit beside the view
  renderTimeline(); renderView(false);
}
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(fitLayout, 120); });

const dark = matchMedia('(prefers-color-scheme: dark)');
const setTheme = () => { document.documentElement.dataset.theme = dark.matches ? 'dark' : 'light'; };
dark.addEventListener('change', setTheme); setTheme();
// a failed fetch means the server is down; say so instead of leaving an empty chat
addEventListener('unhandledrejection', e => { if (e.reason instanceof TypeError) errorLine("Can't reach the MixPilot server. Start it, then reload the page."); });

(async () => {
  document.body.dataset.layer = innerWidth < 1000 ? 'over' : 'beside';
  if (innerWidth < 1000) { chatOpen = false; document.body.classList.add('chat-off'); }
  const id = location.hash.slice(1);
  reset();
  if (id && (await fetch(`/api/sessions/${id}`)).ok) connect(id);
})();
</script>
</body>
